<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LYNDA, a Small Sky Note</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Playfair Display", "serif"],
              body: ["Space Grotesk", "sans-serif"],
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="space-bg min-h-screen font-body text-slate-100">
    <div class="pointer-events-none fixed inset-0">
      <div class="stars-layer stars-layer--soft"></div>
      <div class="stars-layer stars-layer--dense"></div>
      <div class="nebula nebula--one"></div>
      <div class="nebula nebula--two"></div>
      <div class="cosmic-dust"></div>
    </div>

    <main class="relative z-10 mx-auto flex min-h-screen max-w-6xl flex-col gap-16 px-6 py-12 sm:px-10 lg:px-16">
      <section class="grid items-center gap-10 lg:grid-cols-[1.1fr_0.9fr]">
        <div class="glass-panel space-y-6 rounded-[28px] p-8 sm:p-10">
          <p class="text-xs uppercase tracking-[0.35em] text-slate-300">
            A tiny constellation, just for you
          </p>
          <h1 class="font-display text-4xl sm:text-5xl">Meriem, would you let me say hi?</h1>
          <p class="text-base leading-7 text-slate-300 sm:text-lg">
            I am Bilel, 22 years old. I live in Tunisia, what about Y 
          </p>
        </div>

        <div class="sky-panel relative min-h-[320px] overflow-hidden rounded-[28px] border border-white/10 shadow-2xl">
          <div class="sky-gradient"></div>
          <div class="starfield"></div>
          <div class="orb orb--one"></div>
          <div class="orb orb--two"></div>
          <div class="orb orb--three"></div>
          <div class="relative z-10 flex h-full flex-col justify-end p-8">
            <p class="text-sm uppercase tracking-[0.25em] text-slate-200/80">Sky note</p>
            <p class="mt-3 text-xl font-semibold">A gentle hello, floating across the stars.</p>
          </div>
        </div>
      </section>

      <section class="flex justify-center" aria-live="polite">
        <div class="glass-panel w-full max-w-2xl space-y-4 rounded-[28px] p-8 text-center sm:p-10" id="gameCard">
          <h2 class="font-display text-3xl">Quick Question</h2>
          <p class="text-slate-300">Would you accept this hello?</p>
          <div
            class="relative mx-auto mt-6 flex h-48 w-full max-w-md items-center justify-center gap-4 overflow-hidden rounded-2xl border border-dashed border-white/20 bg-slate-950/30"
            id="arena"
          >
            <button
              class="rounded-full bg-gradient-to-r from-amber-300 via-rose-400 to-fuchsia-500 px-6 py-2 text-sm font-semibold text-slate-900 shadow-lg shadow-rose-400/30 transition hover:-translate-y-0.5"
              id="yesBtn2"
            >
              Yes
            </button>
            <button
              class="rounded-full border border-white/50 bg-white/15 px-6 py-2 text-sm font-semibold text-slate-100 shadow-sm ring-1 ring-white/40 transition hover:-translate-y-0.5"
              id="noBtn2"
            >
              No
            </button>
          </div>
          <p class="text-sm text-slate-300">Try catching the No button LOL .</p>
        </div>
      </section>
    </main>

    <canvas id="fireworks" aria-hidden="true"></canvas>

    <script src="script.js"></script>
  </body>
</html>
